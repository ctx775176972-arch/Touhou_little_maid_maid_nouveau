plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    maven {
        name = 'CurseMaven'
        url = 'https://www.cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com'
        content {
            includeGroup 'com.hollingsworth.ars_nouveau'
            includeGroup 'com.hollingsworth.nuggets'
            includeGroup 'vazkii.patchouli'
            includeGroup 'mezz.jei'
        }
    }
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroup 'software.bernie.geckolib'
        }
    }
    maven {
        name = 'Curios'
        url = 'https://maven.theillusivec4.top'
        content {
            includeGroup 'top.theillusivec4.curios'
        }
    }
    maven {
        name = 'Forge'
        url = 'https://maven.minecraftforge.net'
        content {
            includeGroup 'com.github.glitchfiend'
        }
    }
}

neoForge {
    version = neo_version

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        maidNouveau {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    implementation("curse.maven:touhou-little-maid-355044:${touhou_little_maid_file}") {
        exclude group: 'maven.modrinth', module: 'sodium'
        exclude group: 'maven.modrinth', module: 'embeddium'
    }
    implementation("com.hollingsworth.ars_nouveau:ars_nouveau-${minecraft_version}:${ars_nouveau_version}")

    // Runtime prerequisites used by the required mods in the development environment.
    implementation("vazkii.patchouli:Patchouli:${patchouli_version}")
    implementation("software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}")
    implementation("top.theillusivec4.curios:curios-neoforge:${curios_version}+${minecraft_version}")
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('jar', Jar).configure {
    from('LICENSE')
    manifest {
        attributes([
            'Specification-Title'   : mod_name,
            'Specification-Vendor'  : mod_authors,
            'Specification-Version' : mod_version,
            'Implementation-Title'  : project.name,
            'Implementation-Version': project.jar.archiveVersion,
            'Implementation-Vendor' : mod_authors
        ])
    }
}
